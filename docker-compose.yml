services:
  nginx:
    image: nginx:1.25-alpine
    container_name: ${CONTAINER_NAME}-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      # Shared WordPress core files
      - wordpress:/var/www/html

      # IMPORTANT:
      # Nginx must also mount wp-content assets
      - ../wordpress/wp-content/plugins:/var/www/html/wp-content/plugins
      - ../wordpress/wp-content/themes:/var/www/html/wp-content/themes
      - ../wordpress/wp-content/uploads:/var/www/html/wp-content/uploads

      # Nginx virtual host configuration
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - wordpress

    networks:
      - internal

  wordpress:
    build:
      context: .
      dockerfile: ./docker/wordpress/Dockerfile
    container_name: ${CONTAINER_NAME}-wordpress
    restart: unless-stopped

    env_file:
      - .env

    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}

    depends_on:
      - mariadb

    volumes:
      # Shared WordPress core files
      - wordpress:/var/www/html

      # Bind-mounted wp-content directories
      - ../wordpress/wp-content/plugins:/var/www/html/wp-content/plugins
      - ../wordpress/wp-content/themes:/var/www/html/wp-content/themes
      - ../wordpress/wp-content/uploads:/var/www/html/wp-content/uploads

      # Custom PHP configuration
      - ./php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro

    networks:
      - internal

  mariadb:
    image: mariadb:11
    container_name: ${CONTAINER_NAME}-mariadb
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MARIADB_DATABASE}
      MYSQL_USER: ${MARIADB_USER}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}

    volumes:
      # Persistent database storage
      - mariadb_data:/var/lib/mysql
      # Initial database import scripts
      - ../migration/wordpress_database:/docker-entrypoint-initdb.d

    networks:
      - internal

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ${CONTAINER_NAME}-phpmyadmin
    restart: unless-stopped

    ports:
      - "8081:80"

    environment:
      PMA_HOST: mariadb

    depends_on:
      - mariadb

    networks:
      - internal

volumes:
  wordpress:
  mariadb_data:

networks:
  internal: