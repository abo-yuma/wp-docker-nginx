server {
    listen 80;
    server_name localhost;

    # Shared WordPress filesystem mounted from Docker volume
    root /var/www/html;

    # Default index files
    index index.php index.html;

    # IMPORTANT:
    # WordPress front controller routing
    #
    # This is required for pretty permalinks.
    #
    # If this is removed or misconfigured, page may return 404.
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass PHP requests to the WordPress PHP-FPM container
    location ~ \.php$ {

        # IMPORTANT:
        # Prevent execution of non-existent PHP files.
        #
        # Helps avoid invalid PHP execution.
        try_files $uri =404;

        # Support PATH_INFO for WordPress and plugins
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # IMPORTANT:
        # PHP-FPM upstream service hostname and port.
        #
        # If this does not match the Docker service name:
        # - PHP will fail completely
        # - Nginx may return 502 Bad Gateway
        fastcgi_pass wordpress:9000;

        # Default FastCGI parameters
        include fastcgi_params;

        # Default PHP entry point
        fastcgi_index index.php;

        # IMPORTANT:
        # Required so PHP-FPM can resolve the correct script path.
        #
        # Incorrect values here may cause:
        # - "File not found"
        # - PHP execution failures
        # - Security issues
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Forward PATH_INFO to PHP-FPM
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # IMPORTANT:
    # Static assets are served directly by Nginx.
    #
    # Nginx must have access to the same wp-content directory
    # mounted in the WordPress container.
    #
    # If the wp-content bind mount exists only in the PHP container:
    # - Theme screenshots may not appear
    # - CSS/JS/images may return 404
    # - Uploads may fail to load
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires max;
        log_not_found off;
    }
}